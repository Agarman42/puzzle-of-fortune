<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1220">
    <meta name="description" content="Phrase puzzles with multiple modes, daily challenges, and achievements.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Puzzle of Fortune">
    <title>Puzzle of Fortune</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="app-header">
        <div class="app-shell px-4 py-3 flex items-center justify-between gap-3">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">
                    <i class="fa-solid fa-puzzle-piece"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="heading-font brand-title">Puzzle of Fortune</h1>
                    <p class="brand-kicker">Phrase puzzles</p>
                </div>
            </div>

            <div class="header-actions">
                <div class="score-badge" aria-label="Score">
                    <span class="score-kicker">SCORE</span>
                    <span>
                        <span id="header-score" class="score-value tabular-nums">0</span>
                        <span id="header-score-suffix" class="score-suffix"></span>
                    </span>
                </div>
                <button type="button" onclick="showProgressModal()" class="btn-progress">
                    <i class="fa-solid fa-list-check text-xs"></i>
                    <span class="hidden sm:inline">Progress</span>
                </button>
            </div>
        </div>
    </header>

    <div class="app-shell">

        <div id="start-screen" class="start-stage">
            <div class="hero-stage">
                <div class="hero-glow" aria-hidden="true"></div>
                <div class="brand-mark hero-mark" aria-hidden="true">
                    <i class="fa-solid fa-puzzle-piece"></i>
                </div>
                <h2 class="heading-font text-[2.05rem] sm:text-4xl font-bold tracking-tight leading-[1.12]">
                    Solve the world’s<br>best kept phrases
                </h2>
                <p class="hero-copy">Guess the phrase from the clue. Hints cost points. Daily streaks pay in gold.</p>

                <div class="cta-stack">
                    <button type="button" onclick="showGameSetupModal()" class="btn-gold btn-gold-lg">
                        <i class="fa-solid fa-play text-sm"></i>
                        <span>New Session</span>
                    </button>

                    <button type="button" id="daily-btn" onclick="startDailyPuzzle()" class="btn-daily">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span id="daily-btn-label">Daily Puzzle</span>
                        <span id="daily-streak-badge" class="streak-pill"></span>
                    </button>
                    <div id="daily-today-strip" class="daily-strip">
                        <span id="daily-reset-text"></span>
                    </div>

                    <button type="button" onclick="quickStartNormal10()" class="btn-ghost">
                        Quick: 10 Normal
                    </button>
                </div>

                <div class="toolbar">
                    <button type="button" onclick="showHowToPlay()" class="toolbar-btn">
                        <i class="fa-solid fa-question-circle text-xs opacity-80"></i>
                        <span>How to Play</span>
                    </button>
                    <button type="button" id="achievements-btn" onclick="showAchievementsModal()" class="toolbar-btn">
                        <i class="fa-solid fa-trophy text-xs opacity-80"></i>
                        <span id="achievements-btn-text">Achievements</span>
                    </button>
                    <button type="button" onclick="showStatsDashboard()" class="toolbar-btn">
                        <i class="fa-solid fa-chart-bar text-xs opacity-80"></i>
                        <span>Stats</span>
                    </button>
                </div>

                <div class="install-hint">
                    <i class="fa-solid fa-mobile-alt"></i>
                    <span>Works great on phones · Add to Home Screen</span>
                </div>
            </div>
        </div>

        <div id="game-screen" class="hidden play-wrap">
            <div class="status-bar">
                <div class="status-left min-w-0">
                    <button type="button" onclick="quitToMenu()" class="btn-menu">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Menu</span>
                    </button>
                    <div class="min-w-0">
                        <div class="text-xs font-semibold text-slate-200">
                            Puzzle <span id="current-puzzle-num">1</span>
                            <span class="text-slate-500">of <span id="total-puzzles">10</span></span>
                        </div>
                        <div class="flex items-center gap-1.5 min-w-0">
                            <div id="puzzle-status" class="text-[10px] truncate"></div>
                            <div id="game-mode-badge" class="hidden text-[9px] px-1.5 py-px rounded-full font-semibold bg-slate-800 text-slate-300 border border-slate-700"></div>
                        </div>
                    </div>
                    <div id="timer-display" class="timer-chip" title="Time Attack: seconds remaining for this puzzle">
                        <i class="fa-solid fa-stopwatch text-xs"></i>
                        <span id="timer-value">60</span>
                    </div>
                </div>
                <div class="status-right">
                    <div class="solved-chip">
                        <div class="k">SOLVED</div>
                        <div class="v text-base"><span id="solved-count">0</span><span class="text-slate-500">/<span id="total-solved">10</span></span></div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="hint-kicker">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>THE HINT</span>
                </div>
                <div id="hint-text" class="hint-plaque"></div>
                <div id="extra-hint-box" class="extra-hint-plaque hidden"></div>
            </div>

            <div class="mb-5">
                <div class="phrase-head">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="phrase-kicker">THE PHRASE</div>
                        <div id="potential-points" class="points-pill" title="Points you'll receive if you solve correctly right now"></div>
                    </div>
                    <div class="help-row">
                        <button type="button" id="reveal-btn" onclick="revealRandomLetter()" class="btn-help">
                            <i class="fa-solid fa-eye text-[10px]"></i>
                            <span>Reveal letter (−1)</span>
                        </button>
                        <button type="button" id="extra-hint-btn" onclick="useExtraHint()" class="btn-help hidden">
                            <i class="fa-solid fa-lightbulb text-[10px]"></i>
                            <span>Extra clue (−2)</span>
                        </button>
                    </div>
                </div>
                <div id="puzzle-display" class="puzzle-container"></div>
            </div>

            <div class="play-actions">
                <button type="button" id="submit-btn" onclick="submitAnswer()" class="btn-gold w-full text-base">
                    <i class="fa-solid fa-check"></i>
                    <span>Submit</span>
                </button>
                <div class="play-nav">
                    <button type="button" onclick="prevPuzzle()" class="btn-nav btn-nav-quiet">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Prev</span>
                    </button>
                    <button type="button" id="full-reveal-btn" onclick="revealFullAnswerWithConfirm()" class="btn-nav btn-giveup">
                        <span>Give up</span>
                    </button>
                    <button type="button" id="next-btn" onclick="nextPuzzle()" class="btn-nav next">
                        <span>Next</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="success-modal" onclick="if (event.target.id === 'success-modal') hideSuccessModal()"
             class="hidden fortune-overlay" style="z-index:50">
            <div onclick="event.stopImmediatePropagation()"
                 class="fortune-modal w-full sm:w-[400px] p-5 sm:p-6">
                <div class="text-center">
                    <div id="success-icon-circle" class="success-burst">
                        <i id="success-icon" class="fa-solid fa-check-circle text-emerald-400 text-4xl"></i>
                    </div>
                    <h3 id="success-title" class="heading-font text-2xl text-emerald-400">Nailed it!</h3>
                    <p id="success-points" class="success-points mt-1">+10</p>
                    <div class="my-4 text-left rounded-2xl p-4 border border-[var(--hairline-slate)] bg-[rgba(7,11,24,0.55)]">
                        <div class="phrase-kicker mb-1">THE ANSWER</div>
                        <div id="success-answer" class="success-phrase"></div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button type="button" id="success-next-btn" onclick="hideSuccessModal(); nextPuzzle();" class="btn-gold w-full">
                            Next Puzzle
                        </button>
                        <button type="button" onclick="hideSuccessModal()" class="btn-ghost w-full">Stay here</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="js/data/puzzles.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/state.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
